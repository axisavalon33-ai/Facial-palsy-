<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Facial Nerve Palsy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Everything visual is drawn on this canvas -->
  <canvas id="screen"></canvas>
  <video id="video" playsinline muted autoplay></video>

  <!-- Start screen -->
  <div id="menu">
    <div class="card">
      <h1>Facial Nerve Palsy</h1>
      <p class="sub">A Bell's palsy simulation</p>
      <button id="start" class="primary big" disabled>Start</button>
      <p id="status">Loading face tracker…</p>
    </div>
  </div>

  <!-- Controls shown on the live screen -->
  <div id="controls" class="hidden">
    <div class="row">
      <button id="sideLeft" class="seg">Left side</button>
      <button id="sideRight" class="seg">Right side</button>
    </div>
    <label class="sev">
      <span>Severity: <b id="sevLabel"></b></span>
      <input id="severity" type="range" min="1" max="6" step="1" value="5">
    </label>
    <div class="row">
      <button id="original">Show original</button>
      <button id="photoBtn" class="primary">Take photo</button>
    </div>
  </div>

  <div id="caption">Simulation for education. Not a diagnosis.</div>

  <script type="module" src="app.js"></script>
</body>
</html>
